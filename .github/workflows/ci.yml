name: Test

on:
  push:
  pull_request:

env:
  # TODO: pin this to whatever quictls tag/branch you actually build against
  # locally (the libssl.so.81.3 SONAME you had suggests a specific release —
  # check `git -C ~/quictls-install log -1` or wherever you cloned it from).
  QUICTLS_REF: openssl-3.1.4-quic1
  QUICTLS_PREFIX: /home/runner/quictls-install   # matches $(HOME)/quictls-install in your makefile

jobs:
  build-quictls:
    runs-on: ubuntu-latest
    steps:
      - name: Cache quictls build
        id: cache-quictls
        uses: actions/cache@v4
        with:
          path: ${{ env.QUICTLS_PREFIX }}
          key: quictls-${{ env.QUICTLS_REF }}-${{ runner.os }}

      - name: Checkout quictls
        if: steps.cache-quictls.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: quictls/openssl
          ref: ${{ env.QUICTLS_REF }}
          path: quictls-src

      - name: Build quictls
        if: steps.cache-quictls.outputs.cache-hit != 'true'
        run: |
          cd quictls-src
          ./config --prefix="${{ env.QUICTLS_PREFIX }}" --libdir=lib64
          make -j"$(nproc)"
          make install_sw

  test:
    needs: build-quictls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y build-essential

      - name: Restore quictls
        uses: actions/cache@v4
        with:
          path: ${{ env.QUICTLS_PREFIX }}
          key: quictls-${{ env.QUICTLS_REF }}-${{ runner.os }}

      - name: Test
        run: make

  lint:
    needs: build-quictls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt update
          sudo apt install -y clang-tidy clang-format

      - name: Restore quictls
        uses: actions/cache@v4
        with:
          path: ${{ env.QUICTLS_PREFIX }}
          key: quictls-${{ env.QUICTLS_REF }}-${{ runner.os }}

      - name: clang-format check
        run: |
          find include src test \( -name '*.h' -o -name '*.c' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: clang-tidy static analysis
        run: |
          clang-tidy include/qlite.h -- \
            -std=c11 -Iinclude -I"${{ env.QUICTLS_PREFIX }}/include"